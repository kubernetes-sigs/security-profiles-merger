name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # A tag can be pushed at any commit, so this workflow runs the gate
  # itself rather than assuming the commit under it was ever green.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The same gate a pull request passes, so that a tag cannot ship what
      # a pull request could not merge: the tests with the race detector and
      # the coverage floor, the golden contract, and the linters.
      - run: make verify-coverage
      - run: make verify-golden
      - run: make lint
      - run: make build

  release:
    needs: [verify]
    # A fork carries the tags it forked, and pushing one must not start a
    # release under someone else's name.
    if: github.repository == 'kubernetes-sigs/security-profiles-merger'
    runs-on: ubuntu-latest
    # Only this job publishes, so only this job can write, mint an OIDC
    # token for keyless signing, or attest.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Pinned so that a release is reproducible; dependencies.yaml tracks them.
    env:
      COSIGN_VERSION: v3.0.6
      GORELEASER_VERSION: v2.18.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The binaries stay in their build directories (dist/spm_<os>_<arch>_*/),
      # while the SBOMs and checksums are written to dist/ itself.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/spm_*/spm
            dist/spm_*/spm.exe
            dist/spm_*.sbom.json
            dist/checksums.txt
