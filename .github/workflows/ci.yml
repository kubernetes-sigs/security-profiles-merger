name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this workflow as its gate, so that a tag passes
  # exactly the checks a pull request does.
  workflow_call:

# A newer push to a pull request makes the run before it pointless. A run on
# main is not: it uploads the coverage and saves the benchmark baseline and
# the fuzz corpus of its commit, so every merge must finish its own. A group
# holds one running and one pending run and drops the pending one for a
# newer, whether or not it cancels the running one, so the runs outside pull
# requests are grouped by commit and never share one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# bash, not the runner's default shell, on every runner including Windows:
# GitHub starts it with -eo pipefail, so a failure inside a pipe fails the
# step instead of hiding behind the exit code of the command after it.
defaults:
  run:
    shell: bash

# go.mod's go line is the oldest Go the library supports, and the jobs that
# use go-version-file test that floor. The release binaries are built with
# this one instead, a current stable release, so that they do not ship a
# standard library with known vulnerabilities; the jobs that build, test or
# scan what ships use it. release.yml carries the same pin and
# dependencies.yaml tracks both.
env:
  GO_VERSION: "1.27.4"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The module has one dependency, so the cache setup-go keys on go.sum
      # would hold little and, keyed on a go.sum that rarely changes, never
      # refresh. This job and the others that build no tool (vet-arch,
      # test-arch, test-emulated, apparmor-parser, golden and syscalls) go
      # without it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make build

  # .golangci.yml enables the libseccomp build tag, so this job also
  # analyzes the cgo bridge and the tests that check the model against
  # libseccomp. Loading those packages needs the headers, and the
  # distribution's are enough: nothing here is executed, so which
  # libseccomp answers is test-libseccomp's question, not this job's.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # cmd/spm has files for hosts that are not Unix, which the run above
      # never loads: a constant only the Unix file used went unnoticed there.
      # Only the command is linted this way, since the libseccomp bridge the
      # config pulls in does not build for Windows.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version: v2.15.0
          args: ./cmd/...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify-coverage
      # A pull request from a fork gets no secrets, so the upload has
      # nothing to authenticate with. Coverage is a report, not a gate:
      # the threshold in verify-coverage above is the gate.
      # A tag run, which release.yml makes, has no token either and
      # reports nothing a pull request or main has not.
      - if: github.ref_type != 'tag'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          files: build/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The algorithmic bounds in the suite only assert wall-clock limits when
  # neither coverage nor the race detector is instrumenting the code, so the
  # job above measures nothing. This one runs the same tests plain on the
  # floor Go and amd64; test / release go, test / linux-386,
  # test / linux-arm64 and the test jobs on macOS and Windows run
  # uninstrumented as well, so the bounds are a real assertion there too.
  # The emulated test / linux-<arch> (qemu) jobs run with -short, which
  # turns the bounds off.
  test-bounds:
    name: test / bounds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...

  # The same plain run on the Go the release binaries are built with, which
  # is not the floor the jobs above test.
  test-release-go:
    name: test / release go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -count=1 ./...

  # The seccomp merges settle rules by the native architecture: a 32-bit one
  # compares half of each value, and one that multiplexes socket and IPC
  # calls reads those rules a second way. The jobs above only ever run as
  # amd64, so the suite also runs where that needs no emulation: as 386 on
  # the same runners, which is both 32-bit and multiplexing, and on an arm64
  # runner. s390x, ppc64le and arm need qemu, see test-emulated.
  test-arch:
    name: test / linux-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: "386"
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

  # The rest of the architectures the seccomp merges read differently, and
  # the 32-bit arm, run under qemu user emulation. Emulation slows the suite
  # several times over, so it runs with -short, which turns off the
  # wall-clock bounds (see testutil.CheckWallClock); the algorithms are
  # bounded by the jobs that run natively.
  test-emulated:
    name: test / linux-${{ matrix.goarch }} (qemu)
    # Pinned rather than ubuntu-latest: the job depends on the image's
    # qemu-user-static and binfmt-support packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        goarch: [s390x, ppc64le, arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # binfmt_misc runs a foreign test binary through qemu, so go test
      # needs no exec wrapper.
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
      - env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go test -short -count=1 -timeout=30m ./...

  # The runners are all 64-bit, so a word-size mistake compiles here and
  # breaks for whoever vendors the library into a 32-bit build. Nothing is
  # executed, so no emulation is needed; these are the architectures
  # Kubernetes ships and seccomp/arch.go maps. NetBSD compiles
  # cmd/spm/nofollow_netbsd.go, which no other job builds. FreeBSD adds no
  # file of its own; it keeps a BSD in the set the Unix files are checked
  # on besides macOS, which a change aimed at NetBSD could break.
  vet-arch:
    name: vet / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: ["386", "arm", "arm64", "s390x", "ppc64le"]
        include:
          - goos: netbsd
            goarch: amd64
          - goos: freebsd
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...

  # The seccomp merge semantics are a claim about how runc and libseccomp load
  # a profile. This job checks that claim against libseccomp itself, which
  # needs cgo and the headers, so it is separate from the main test job.
  #
  # The versions are built from their release tarballs rather than taken from
  # the runner image: the whole safe-shape model rests on what libseccomp
  # compiles, so which version answered has to be recorded, not inherited.
  # Add a version here when libseccomp releases one, and to SYSCALL_CSVS in
  # the Makefile, which TestGenerateSyscallTable checks against its own list.
  # SYSCALL_CSVS also lists 2.5.2, which is not run here: it evaluates some
  # binary trees differently, and the merges support 2.5.4 and newer (see
  # the Architectures section of the seccomp package documentation).
  #
  # Several tests read the native architecture, which decides how the
  # merges settle 32-bit comparisons and socketcall, so the newest release
  # also runs on an arm64 runner and as 386, built with -m32 on amd64.
  test-libseccomp:
    name: test-libseccomp / ${{ matrix.version }}${{ matrix.arch != 'amd64' && format(' / {0}', matrix.arch) || '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      LIBSECCOMP_PREFIX: ${{ github.workspace }}/.libseccomp
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "2.5.4"
            sha256: d82902400405cf0068574ef3dc1fe5f5926207543ba1ae6f8e7a1576351dcbdb
            arch: amd64
            runner: ubuntu-latest
          - version: "2.5.5"
            sha256: 248a2c8a4d9b9858aa6baf52712c34afefcf9c9e94b76dce02c1c9aa25fb3375
            arch: amd64
            runner: ubuntu-latest
          - version: "2.6.0"
            sha256: 83b6085232d1588c379dc9b9cae47bb37407cf262e6e74993c61ba72d2a784dc
            arch: amd64
            runner: ubuntu-latest
          - version: "2.6.1"
            sha256: 501f66c667225d53791b97e1d7cf85ab764c297d04881f60f38f451c4b0ee1be
            arch: amd64
            runner: ubuntu-latest
          - version: "2.6.1"
            sha256: 501f66c667225d53791b97e1d7cf85ab764c297d04881f60f38f451c4b0ee1be
            arch: arm64
            runner: ubuntu-24.04-arm
          - version: "2.6.1"
            sha256: 501f66c667225d53791b97e1d7cf85ab764c297d04881f60f38f451c4b0ee1be
            arch: "386"
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The 386 run builds libseccomp and the test binary for 32 bits on
      # the amd64 runner, which runs them natively. configure and cgo both
      # take the compiler from CC, so -m32 rides on it and configure keeps
      # its default -g -O2.
      - name: Set up a 32-bit build
        if: matrix.arch == '386'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          {
            echo "LIBSECCOMP_CONFIGURE=--host=i686-linux-gnu"
            echo "GOARCH=386"
            echo "CC=gcc -m32"
          } >> "$GITHUB_ENV"
      - name: Build libseccomp ${{ matrix.version }}
        env:
          LIBSECCOMP_VERSION: ${{ matrix.version }}
          LIBSECCOMP_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gperf
          curl -sSfL -o libseccomp.tar.gz \
            "https://github.com/seccomp/libseccomp/releases/download/v$LIBSECCOMP_VERSION/libseccomp-$LIBSECCOMP_VERSION.tar.gz"
          # The model is only worth as much as the library it is checked
          # against, so the tarball is pinned rather than merely fetched.
          echo "$LIBSECCOMP_SHA256  libseccomp.tar.gz" | sha256sum --check --strict
          tar xf libseccomp.tar.gz
          cd "libseccomp-$LIBSECCOMP_VERSION"
          # A prefix of its own, not the system directory: ldconfig points
          # the soname link at the newest file there, so a build older than
          # the runner image's copy would never be the one loaded. The run
          # steps name this prefix for the build (pkg-config) and the loader.
          read -ra configure <<<"${LIBSECCOMP_CONFIGURE:-}"
          ./configure --prefix="$LIBSECCOMP_PREFIX" "${configure[@]}"
          make -j"$(nproc)"
          make install
      # pkg-config only describes the build. TestLibseccompVersion reads the
      # library the process loaded and fails when it is not this one, so a
      # model checked here is checked against the version named here.
      - name: Run the model against libseccomp ${{ matrix.version }}
        env:
          LIBSECCOMP_VERSION: ${{ matrix.version }}
          PKG_CONFIG_PATH: ${{ env.LIBSECCOMP_PREFIX }}/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ env.LIBSECCOMP_PREFIX }}/lib
        run: make test-libseccomp
      # libseccomp sorts the syscalls of a filter by priority unless asked
      # for a binary tree, which is what runc asks for above 32 syscall
      # names, and so for every profile of a realistic size. The model has
      # to hold for the programs of both. Only the tests that compile with
      # the library depend on the level, so only they run again.
      - name: Run the model against libseccomp ${{ matrix.version }}, binary tree
        env:
          LIBSECCOMP_VERSION: ${{ matrix.version }}
          SPM_LIBSECCOMP_OPTIMIZE: "2"
          PKG_CONFIG_PATH: ${{ env.LIBSECCOMP_PREFIX }}/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ env.LIBSECCOMP_PREFIX }}/lib
        run: make test-libseccomp TESTFLAGS='-run Libseccomp'

  # The apparmor package ports the stages apparmor_parser runs a path
  # through (apparmor/parser_port.go). This checks the port against the
  # parser the distribution ships, over a table of patterns, behind a build
  # tag since it needs the binary. The test fails rather than skips when the
  # binary is missing, so a broken install cannot pass.
  apparmor-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apparmor
      - env:
          SPM_REQUIRE_APPARMOR_PARSER: "1"
        run: go test -count=1 -tags apparmor_parser -run TestTranslationAgreesWithApparmorParser ./apparmor/

  # The library handles Linux profile paths on every host and binaries are
  # released for these platforms, so the packages are tested there too, on
  # the floor and on the Go the binaries are built with.
  test-cross:
    name: test / ${{ matrix.os }} / ${{ matrix.go }} go
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        go: [floor, release]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go == 'release' && env.GO_VERSION || '' }}
          go-version-file: ${{ matrix.go == 'floor' && 'go.mod' || '' }}
      - run: go test -count=1 ./...

  fuzz-prepare:
    name: fuzz / prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          grep -rn '^func Fuzz' --include='*_test.go' . \
            | sed 's|^\./||' \
            | while IFS=: read -r file _ line; do
                fn=${line#func }
                fn=${fn%%(*}
                dir=$(dirname "$file")
                # The package path and the function name both go into the
                # name, so a new target cannot quietly take the job, and the
                # cache key, of an existing one.
                name="${dir//\//-}-$(tr '[:upper:]' '[:lower:]' <<<"${fn#Fuzz}")"
                echo "{\"name\":\"$name\",\"package\":\"./$dir/\",\"target\":\"$fn\"}"
              done > "$tmp"
          matrix=$(jq -s -c '.' < "$tmp")
          rm -f "$tmp"
          # A target dropped anywhere above would only shrink the matrix,
          # and a shorter matrix still runs green. So the matrix is counted
          # back against the declarations it was derived from.
          want=$(grep -rc '^func Fuzz' --include='*_test.go' . \
            | awk -F: '{ sum += $2 } END { print sum + 0 }')
          got=$(jq -r 'length' <<<"$matrix")
          names=$(jq -r '[.[].name] | unique | length' <<<"$matrix")
          if [ "$want" -eq 0 ] || [ "$got" -ne "$want" ] || [ "$names" -ne "$want" ]; then
            echo "::error::fuzz matrix has $got entries under $names names for $want targets"
            jq -r '.[].name' <<<"$matrix" | sort | uniq -d
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz / ${{ matrix.fuzz.name }}
    needs: [fuzz-prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        fuzz: ${{ fromJSON(needs.fuzz-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The corpus below lives inside the build cache, so leaving this
          # on would store it twice and grow the setup-go entry without
          # bound, once per target per commit.
          cache: false
      # The corpus the fuzzing engine grows lives in the Go build cache, not
      # in testdata/fuzz, which only holds committed regression inputs.
      - run: echo "GOFUZZCACHE=$(go env GOCACHE)/fuzz" >> "$GITHUB_ENV"
      # A pull request starts from the corpus main grew and saves none of
      # its own: a cache saved from a pull request can only be restored by
      # that pull request, so saving one per target and commit there fills
      # the cache quota with entries nothing reads.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOFUZZCACHE }}
          key: fuzz-${{ matrix.fuzz.name }}-${{ github.sha }}
          restore-keys: fuzz-${{ matrix.fuzz.name }}-
      # go test exits 0 when the pattern matches no target, so a target
      # renamed, deleted or hidden behind a build tag would fuzz nothing for
      # thirty seconds and pass. The matrix completeness check counts the
      # declarations; this checks that the run did something. The matrix
      # values reach the script through the environment rather than being
      # written into it. -run limits the plain tests to the target's seed
      # corpus, rather than running the whole package under the fuzzing
      # instrumentation first.
      - env:
          FUZZ_TARGET: ${{ matrix.fuzz.target }}
          FUZZ_PACKAGE: ${{ matrix.fuzz.package }}
        run: |
          go test -run="^${FUZZ_TARGET}\$" -fuzz="^${FUZZ_TARGET}\$" \
            -fuzztime=30s "$FUZZ_PACKAGE" 2>&1 | tee fuzz.log
          if grep -q "no fuzz tests to fuzz" fuzz.log; then
            echo "::error::${FUZZ_TARGET} matched no fuzz target"
            exit 1
          fi
      # A failing input is written to the package's testdata/fuzz, where it
      # would die with the runner. It is what reproduces the failure, so it
      # is kept as an artifact to commit as a seed.
      - id: crashers
        if: failure()
        run: |
          set -euo pipefail
          {
            echo 'paths<<EOF'
            git ls-files --others --exclude-standard -- '*/testdata/fuzz/*'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - if: failure() && steps.crashers.outputs.paths != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ matrix.fuzz.name }}
          path: ${{ steps.crashers.outputs.paths }}
      # Only main saves: a cache saved on a tag, which release.yml runs
      # this workflow for, is one nothing restores.
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOFUZZCACHE }}
          key: fuzz-${{ matrix.fuzz.name }}-${{ github.sha }}

  # The benchmark matrix is written out, so a package that gains its first
  # benchmark would never run it. This counts the packages declaring one
  # against the matrix, as fuzz-prepare does for the fuzz targets.
  benchmark-check:
    name: benchmark / matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # yq comes with the runner image.
      - run: |
          set -euo pipefail
          want=$(grep -rl '^func Benchmark' --include='*_test.go' . \
            | xargs -n1 dirname | sed 's|^\./||; s|^|./|; s|$|/|' | sort -u)
          got=$(yq '.jobs.benchmark.strategy.matrix.include[].package' \
            .github/workflows/ci.yml | sort -u)
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error::the benchmark matrix does not list the packages that declare benchmarks"
            diff <(echo "$want") <(echo "$got") || true
            exit 1
          fi

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: benchmark / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: seccomp
            package: ./seccomp/
          - name: apparmor
            package: ./apparmor/
          - name: landlock
            package: ./landlock/
          - name: internal-merge
            package: ./internal/merge/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # pipefail, which the workflow's default shell sets, keeps a failing
      # or panicking benchmark from hiding behind the exit code of tee, which
      # would leave the job green on partial output.
      - env:
          BENCH_PACKAGE: ${{ matrix.package }}
        run: go test -bench=. -benchmem -count=5 -run='^$' "$BENCH_PACKAGE" | tee benchmark.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ matrix.name }}
          path: benchmark.txt
      # As for the fuzz corpus, a pull request reads the baseline main saved
      # and saves none of its own, which nothing else could restore.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./cache
          key: benchmark-${{ matrix.name }}-${{ github.sha }}
          restore-keys: benchmark-${{ matrix.name }}-
      # Recorded, not enforced. A doubling looked like a safe threshold
      # until it was tried: the baseline is a cached measurement from
      # another run on another shared runner, so the comparison carries
      # that machine's contention as well as this one's. A run that
      # changed no benchmark measurably against main still alerted on
      # every landlock benchmark at 2.06x and on 60 seccomp benchmarks at
      # 3.4x to 5.8x, including one that takes 45ns. Gating on that trains
      # people to ignore a red run.
      #
      # What actually guards the cost is deterministic and lives
      # elsewhere: the bound assertions the test / bounds job runs
      # uninstrumented, and the budgets the merge enforces. This job
      # tracks the trend and puts it in the job summary.
      #
      # comment-on-alert is left off on purpose: it writes to the pull
      # request, which needs a token a fork does not get.
      - uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: go
          output-file-path: benchmark.txt
          external-data-json-path: ./cache/benchmark-data.json
          alert-threshold: "200%"
          summary-always: true
          fail-on-alert: false
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./cache
          key: benchmark-${{ matrix.name }}-${{ github.sha }}

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: hack/tools/go.sum
      # govulncheck reports standard library vulnerabilities for the Go it
      # runs under, so it runs under the Go the release is built with. local
      # keeps go tool from switching to another toolchain, and so to another
      # standard library, should hack/tools/go.mod ever require a newer one.
      - run: make govulncheck
        env:
          GOTOOLCHAIN: local

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - run: make verify-tidy

  # The jobs that touch hack/tools/go.mod (govulncheck, tidy, mdtoc,
  # actionlint, api and dependencies) use the Go the release is built with:
  # that module's go line is newer than the floor in go.mod, setup-go sets
  # GOTOOLCHAIN=local, and the go command picks its toolchain from go.mod
  # even under -modfile, so it would not switch by itself. They key their
  # cache on hack/tools/go.sum, which holds the modules they build, rather
  # than on the root go.sum, which holds one module and so never changes
  # the key when a tool is updated.
  mdtoc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: hack/tools/go.sum
      - run: make verify-mdtoc

  # actionlint runs shellcheck on every run step, which the runner image
  # provides.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: hack/tools/go.sum
      - run: make lint-actions

  # The module's API against the latest release, as gorelease reports it,
  # with the version it suggests for the next one. It is a report, not a
  # gate: a pull request that adds API is expected to show up here, and
  # whether a change is allowed is for the review and RELEASE.md to decide.
  # The base is the newest tag before HEAD, so that a tag run compares
  # against the release before it rather than against itself.
  api:
    name: api / gorelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: hack/tools/go.sum
      # The report is captured before it goes to the summary, so that the
      # code fence around it closes even when gorelease fails. It is kept
      # outside the checkout, which gorelease refuses to read with an
      # untracked file in it.
      - run: |
          status=0
          report="${RUNNER_TEMP}/api-report.txt"
          make -s api-report > "${report}" 2>&1 || status=$?
          cat "${report}"
          {
            echo '```'
            cat "${report}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make verify-golden

  # seccomp/syscalls.go is generated from the syscalls.csv of every
  # libseccomp release the guard covers; regenerating it and asking git
  # whether it moved keeps the table from drifting from its sources.
  syscalls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make verify-syscalls

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: hack/tools/go.sum
      - run: make verify-dependencies

  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GORELEASER_VERSION: v2.20.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --skip=sign --clean
      # release.yml attests over these paths. goreleaser decides them, so a
      # version bump that moves a binary or an SBOM has to break here rather
      # than ship a release with nothing attested: attest-build-provenance
      # only errors when no subject at all matches.
      # .goreleaser.yml builds 8 binaries: linux on amd64, arm64, ppc64le
      # and s390x, darwin and windows on amd64 and arm64, each with an SBOM.
      # A count that changes means the platforms did, and RELEASE.md, which
      # lists them, has to change with it.
      - name: Check the paths the release attests over
        run: |
          set -euo pipefail
          ls -1 dist/spm_*/spm dist/spm_*/spm.exe \
            dist/spm_*.sbom.json dist/checksums.txt
          binaries=$(find dist -path 'dist/spm_*/spm' -o -path 'dist/spm_*/spm.exe' | wc -l)
          sboms=$(find dist -maxdepth 1 -name 'spm_*.sbom.json' | wc -l)
          if [ "$binaries" -ne 8 ] || [ "$sboms" -ne 8 ]; then
            echo "::error::$binaries binaries and $sboms SBOMs, want 8 of each"
            exit 1
          fi
