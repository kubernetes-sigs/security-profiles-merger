name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this workflow as its gate, so that a tag passes
  # exactly the checks a pull request does.
  workflow_call:

# A newer push to a pull request makes the run before it pointless. A run on
# main is not: it uploads the coverage and saves the fuzz corpus of its
# commit, so every merge must finish its own. A group holds one running and
# one pending run and drops the pending one for a newer, whether or not it
# cancels the running one, so the runs outside pull requests are grouped by
# commit and never share one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# bash, not the runner's default shell, on every runner including Windows:
# GitHub starts it with -eo pipefail, so a failure inside a pipe fails the
# step instead of hiding behind the exit code of the command after it.
defaults:
  run:
    shell: bash

# go.mod's go line is the oldest Go the library supports, and the jobs that
# set go-version-file to go.mod test that floor. The release binaries are
# built with the Go in .go-version instead, a current stable release, so
# that they do not ship a standard library with known vulnerabilities; the
# jobs that build, test or scan what ships use it, as release.yml and
# dependency-updates.yml do, and dependencies.yaml tracks it.
#
# The module has one dependency, so the cache setup-go keys on go.sum holds
# little of the module and, keyed on a go.sum that rarely changes, never
# refreshes. What it does hold is the standard library compiled for the
# runner, which stays valid until the Go version changes, so the jobs that
# compile much of it for their own platform keep it. The cross-architecture
# jobs, the jobs that test a package or two, and fuzz, which keeps its
# corpus in the build cache, go without it.

jobs:
  # .golangci.yml enables the libseccomp build tag, so this job also
  # analyzes the cgo bridge and the tests that check the model against
  # libseccomp. Loading those packages needs the headers, and the
  # distribution's are enough: nothing here is executed, so which
  # libseccomp answers is test-libseccomp's question, not this job's.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # cmd/spm has files for other hosts, which the run above never loads:
      # a constant only the Unix file used went unnoticed on Windows, and
      # blocking_darwin.go and nofollow_netbsd.go build nowhere else. Only
      # the command is linted this way, since the libseccomp bridge the
      # config pulls in does not build for these hosts. The action puts the
      # binary it installed on PATH, and the Makefile's LINT_OSES names the
      # hosts. The action saves its cache after the job, so it holds these
      # runs too.
      - run: make lint-cmd-oses GOLANGCI_LINT="$(command -v golangci-lint)"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make verify-coverage
      # A pull request from a fork gets no secrets, so the upload has
      # nothing to authenticate with. Coverage is a report, not a gate:
      # the threshold in verify-coverage above is the gate.
      # A tag run, which release.yml makes, has no token either and
      # reports nothing a pull request or main has not.
      - if: github.ref_type != 'tag'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          files: build/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The suite on the Go the release binaries are built with, which is not
  # the floor the job above tests, run by make test-wall-clock: one package
  # at a time, without coverage or the race detector, with the wall-clock
  # limits of the algorithmic bounds turned on. This job and
  # test / linux-386 are the only ones that assert those limits; the others
  # share their runners with the parallel packages of their run. The
  # benchmarks run once each, so that one that no longer builds or panics
  # fails here; their timings are for make bench to measure.
  test-release-go:
    name: test / release go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - run: make test-wall-clock
      - run: go test -run='^$' -bench=. -benchtime=1x ./...

  # The seccomp merges settle rules by the native architecture: a 32-bit one
  # compares half of each value, and one that multiplexes socket and IPC
  # calls reads those rules a second way. The jobs above only ever run as
  # amd64, so the suite also runs where that needs no emulation: as 386 on
  # the same runners, which is both 32-bit and multiplexing, and on an arm64
  # runner. s390x, ppc64le and arm need qemu, see test-emulated.
  test-arch:
    name: test / linux-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: "386"
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The seccomp merges take other paths on a 32-bit native architecture,
      # so the 386 run asserts the wall-clock bounds too (see
      # test-release-go).
      - env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          if [ "$GOARCH" = 386 ]; then
            make test-wall-clock
          else
            go test -count=1 ./...
          fi

  # The rest of the architectures the seccomp merges read differently, and
  # the 32-bit arm, run under qemu user emulation. Emulation slows the suite
  # several times over, which still takes a few minutes; the wall-clock
  # bounds of the algorithms are asserted by test / release go and
  # test / linux-386, which run natively.
  test-emulated:
    name: test / linux-${{ matrix.goarch }} (qemu)
    # Pinned rather than ubuntu-latest: the job depends on the image's
    # qemu-user-static and binfmt-support packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        goarch: [s390x, ppc64le, arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # binfmt_misc runs a foreign test binary through qemu, so go test
      # needs no exec wrapper.
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
      - env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go test -count=1 -timeout=30m ./...

  # Merge results as the kernel and the runtimes load them: Landlock
  # intersections against their inputs stacked as layers, and seccomp
  # results through runc and crun, whose flags strace shows (make
  # test-runtime). The runtimes are the static release binaries of the
  # versions below, pinned by checksum and tracked in dependencies.yaml,
  # rather than whatever the runner image or apt carries: the flags a
  # runtime sets for a profile without "flags" changed between releases.
  # They run rootless, which needs the unprivileged user namespaces the
  # runner image restricts through AppArmor, so the job lifts that
  # restriction. SPM_RUNTIMETEST_REQUIRE makes a missing or too old
  # runtime, strace or Landlock fail the job rather than skip its tests.
  test-runtime:
    name: test / runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNC_VERSION: 1.5.3
      RUNC_SHA256: 50dcc0b257d724fe07f3852c2dda52340223f038227c7572644eec870741223e
      CRUN_VERSION: "1.31"
      CRUN_SHA256: 8cacae171bb0e5f9e275adac2eeb2c6ec8c69fdedff7b008eadd8cdd25b0d349
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # /usr/local/bin comes before the image's /usr/bin on PATH, and the
      # step checks that the pinned versions are the ones the tests find.
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y strace
          curl -sSfL -o runc \
            "https://github.com/opencontainers/runc/releases/download/v$RUNC_VERSION/runc.amd64"
          curl -sSfL -o crun \
            "https://github.com/containers/crun/releases/download/$CRUN_VERSION/crun-$CRUN_VERSION-linux-amd64"
          printf '%s  runc\n%s  crun\n' "$RUNC_SHA256" "$CRUN_SHA256" | sha256sum --check --strict
          sudo install -m 0755 runc crun /usr/local/bin/
          rm runc crun
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          cat /sys/kernel/security/lsm; echo
          command -v runc crun
          # A runtime the image puts earlier on PATH must not stand in for
          # the pinned one.
          # sed reads all of the output, so no runtime dies of SIGPIPE.
          test "$(runc --version | sed -n 1p)" = "runc version $RUNC_VERSION"
          test "$(crun --version | sed -n 1p)" = "crun version $CRUN_VERSION"
      - env:
          SPM_RUNTIMETEST_REQUIRE: "1"
        run: make test-runtime

  # The seccomp merge semantics are a claim about how runc and libseccomp load
  # a profile. This job checks that claim against libseccomp itself, which
  # needs cgo and the headers, so it is separate from the main test job.
  #
  # The versions are built from their release tarballs rather than taken from
  # the runner image: the whole safe-shape model rests on what libseccomp
  # compiles, so which version answered has to be recorded, not inherited.
  # Add a version here when libseccomp releases one, and to SYSCALL_CSVS in
  # the Makefile, which TestGenerateSyscallTable checks against its own list.
  # SYSCALL_CSVS also lists 2.5.2, which is not run here: it evaluates some
  # binary trees differently, and the merges support 2.5.4 and newer (see
  # the Architectures section of the seccomp package documentation).
  #
  # Several tests read the native architecture, which decides how the
  # merges settle 32-bit comparisons, socketcall and lost rules, so the
  # newest release also runs on an arm64 runner and as 386, built with -m32
  # on amd64, and so does 2.6.1, the newest that loses rules (see the
  # Architectures section of the seccomp package documentation), until it
  # is no longer supported.
  #
  # libseccomp sorts the syscalls of a filter by priority unless asked for
  # a binary tree, which is what runc asks for above 32 syscall names, and
  # so for every profile of a realistic size. The model has to hold for the
  # programs of both, so every combination runs at both optimization
  # levels, as jobs of their own rather than one after the other in a job.
  test-libseccomp:
    name: test-libseccomp / ${{ matrix.version }}${{ matrix.arch != 'amd64' && format(' / {0}', matrix.arch) || '' }}${{ matrix.optimize == '2' && ' / binary tree' || '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      LIBSECCOMP_PREFIX: ${{ github.workspace }}/.libseccomp
    strategy:
      fail-fast: false
      matrix:
        version: ["2.5.4", "2.5.5", "2.6.0", "2.6.1", "2.6.2"]
        arch: [amd64, arm64, "386"]
        # 0 keeps libseccomp's default, 2 asks for a binary tree.
        optimize: ["0", "2"]
        exclude:
          - {version: "2.5.4", arch: arm64}
          - {version: "2.5.4", arch: "386"}
          - {version: "2.5.5", arch: arm64}
          - {version: "2.5.5", arch: "386"}
          - {version: "2.6.0", arch: arm64}
          - {version: "2.6.0", arch: "386"}
        include:
          - version: "2.5.4"
            sha256: d82902400405cf0068574ef3dc1fe5f5926207543ba1ae6f8e7a1576351dcbdb
          - version: "2.5.5"
            sha256: 248a2c8a4d9b9858aa6baf52712c34afefcf9c9e94b76dce02c1c9aa25fb3375
          - version: "2.6.0"
            sha256: 83b6085232d1588c379dc9b9cae47bb37407cf262e6e74993c61ba72d2a784dc
          - version: "2.6.1"
            sha256: 501f66c667225d53791b97e1d7cf85ab764c297d04881f60f38f451c4b0ee1be
          - version: "2.6.2"
            sha256: 6b845d352c6d7887d8d134c43d86850d40f5dcee11ad1675c18197ae4d869d42
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: "386"
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The 386 run builds libseccomp and the test binary for 32 bits on
      # the amd64 runner, which runs them natively. configure and cgo both
      # take the compiler from CC, so -m32 rides on it and configure keeps
      # its default -g -O2. cgo needs gcc-multilib even where the library
      # comes from the cache, so a step below installs it.
      - name: Set up a 32-bit build
        if: matrix.arch == '386'
        run: |
          set -euo pipefail
          {
            echo "LIBSECCOMP_CONFIGURE=--host=i686-linux-gnu"
            echo "GOARCH=386"
            echo "CC=gcc -m32"
          } >> "$GITHUB_ENV"
      # The installed library depends only on the tarball and on how it is
      # built, which the version, its checksum and the arch axis decide; the
      # optimization level only changes what the tests ask of it, so both
      # levels share an entry. The runner image is in the key too, so that a
      # build linked against one image's glibc is not restored on another
      # while ubuntu-latest rolls over; ImageOS is in the runner's
      # environment but not in the env context, so a step hands it over.
      # The prefix lies in the workspace, whose path is the same in every
      # run of this repository, which the pkg-config file and the libtool
      # archives written into it rely on. Raise the number in the key when
      # the build step changes what it installs. Restoring a stale build
      # would not go unnoticed: TestLibseccompVersion fails when the library
      # loaded is not the version the matrix names. Only main saves, as for
      # the fuzz corpora below: what a pull request or a tag saves, nothing
      # restores again.
      - id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - id: libseccomp-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LIBSECCOMP_PREFIX }}
          key: libseccomp-1-${{ matrix.version }}-${{ matrix.arch }}-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ matrix.sha256 }}
      # gperf is for the build alone, gcc-multilib for every 32-bit run.
      - name: Install packages
        if: matrix.arch == '386' || steps.libseccomp-cache.outputs.cache-hit != 'true'
        env:
          CACHE_HIT: ${{ steps.libseccomp-cache.outputs.cache-hit }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          packages=()
          if [ "$CACHE_HIT" != true ]; then packages+=(gperf); fi
          if [ "$ARCH" = 386 ]; then packages+=(gcc-multilib); fi
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"
      - name: Build libseccomp ${{ matrix.version }}
        if: steps.libseccomp-cache.outputs.cache-hit != 'true'
        env:
          LIBSECCOMP_VERSION: ${{ matrix.version }}
          LIBSECCOMP_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          curl -sSfL -o libseccomp.tar.gz \
            "https://github.com/seccomp/libseccomp/releases/download/v$LIBSECCOMP_VERSION/libseccomp-$LIBSECCOMP_VERSION.tar.gz"
          # The model is only worth as much as the library it is checked
          # against, so the tarball is pinned rather than merely fetched.
          echo "$LIBSECCOMP_SHA256  libseccomp.tar.gz" | sha256sum --check --strict
          tar xf libseccomp.tar.gz
          cd "libseccomp-$LIBSECCOMP_VERSION"
          # A prefix of its own, not the system directory: ldconfig points
          # the soname link at the newest file there, so a build older than
          # the runner image's copy would never be the one loaded. The run
          # steps name this prefix for the build (pkg-config) and the loader.
          read -ra configure <<<"${LIBSECCOMP_CONFIGURE:-}"
          ./configure --prefix="$LIBSECCOMP_PREFIX" "${configure[@]}"
          make -j"$(nproc)"
          make install
      # pkg-config only describes the build. TestLibseccompVersion reads the
      # library the process loaded and fails when it is not this one, so a
      # model checked here is checked against the version named here.
      - name: Run the model against libseccomp ${{ matrix.version }}
        env:
          LIBSECCOMP_VERSION: ${{ matrix.version }}
          SPM_LIBSECCOMP_OPTIMIZE: ${{ matrix.optimize }}
          PKG_CONFIG_PATH: ${{ env.LIBSECCOMP_PREFIX }}/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ env.LIBSECCOMP_PREFIX }}/lib
        run: make test-libseccomp
      # Saved only once the tests, TestLibseccompVersion among them, passed
      # against it.
      - if: github.ref == 'refs/heads/main' && steps.libseccomp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LIBSECCOMP_PREFIX }}
          key: ${{ steps.libseccomp-cache.outputs.cache-primary-key }}

  # The apparmor package ports the stages apparmor_parser runs a path
  # through (apparmor/parser_port.go). This checks the port against the
  # parser the distribution ships, over a table of patterns and random ones
  # from a fixed seed, behind a build tag since it needs the binary (make
  # test-apparmor-parser). The tests fail rather than skip when the binary
  # is missing, so a broken install cannot pass.
  apparmor-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apparmor
      - env:
          SPM_REQUIRE_APPARMOR_PARSER: "1"
        run: make test-apparmor-parser

  # The library handles Linux profile paths on every host and binaries are
  # released for these platforms, so the packages are tested there too, on
  # the floor and on the Go the binaries are built with.
  # macos-latest is arm64 and windows-latest amd64, so the Intel macOS and
  # arm64 Windows runners cover the other two platforms the releases ship.
  test-cross:
    name: test / ${{ matrix.os }} / ${{ matrix.go }} go
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-26-intel, windows-latest, windows-11-arm]
        go: [floor, release]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.go == 'floor' && 'go.mod' || '.go-version' }}
      - run: go test -count=1 ./...

  fuzz-prepare:
    name: fuzz / prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          grep -rn '^func Fuzz' --include='*_test.go' . \
            | sed 's|^\./||' \
            | while IFS=: read -r file _ line; do
                fn=${line#func }
                fn=${fn%%(*}
                dir=$(dirname "$file")
                # The package path and the function name both go into the
                # name, so a new target cannot quietly take the job, and the
                # cache key, of an existing one.
                name="${dir//\//-}-$(tr '[:upper:]' '[:lower:]' <<<"${fn#Fuzz}")"
                echo "{\"name\":\"$name\",\"package\":\"./$dir/\",\"target\":\"$fn\"}"
              done > "$tmp"
          matrix=$(jq -s -c '.' < "$tmp")
          rm -f "$tmp"
          # Two targets under one name would share a job and a cache key.
          got=$(jq -r 'length' <<<"$matrix")
          names=$(jq -r '[.[].name] | unique | length' <<<"$matrix")
          if [ "$got" -eq 0 ] || [ "$names" -ne "$got" ]; then
            echo "::error::fuzz matrix has $got entries under $names names"
            jq -r '.[].name' <<<"$matrix" | sort | uniq -d
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz / ${{ matrix.fuzz.name }}
    needs: [fuzz-prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        fuzz: ${{ fromJSON(needs.fuzz-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # The corpus below lives inside the build cache, so leaving this
          # on would store it twice and grow the setup-go entry without
          # bound, once per target per commit.
          cache: false
      # The corpus the fuzzing engine grows lives in the Go build cache, not
      # in testdata/fuzz, which only holds committed regression inputs.
      - run: echo "GOFUZZCACHE=$(go env GOCACHE)/fuzz" >> "$GITHUB_ENV"
      # A pull request starts from the corpus main grew and saves none of
      # its own: a cache saved from a pull request can only be restored by
      # that pull request, so saving one per target and commit there fills
      # the cache quota with entries nothing reads.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOFUZZCACHE }}
          key: fuzz-${{ matrix.fuzz.name }}-${{ github.sha }}
          restore-keys: fuzz-${{ matrix.fuzz.name }}-
      # go test exits 0 when the pattern matches no target, so a target
      # renamed, deleted or hidden behind a build tag would fuzz nothing for
      # thirty seconds and pass; this checks that the run did something. The
      # matrix values reach the script through the environment rather than
      # being written into it. -run limits the plain tests to the target's
      # seed corpus, rather than running the whole package under the fuzzing
      # instrumentation first.
      - env:
          FUZZ_TARGET: ${{ matrix.fuzz.target }}
          FUZZ_PACKAGE: ${{ matrix.fuzz.package }}
        run: |
          go test -run="^${FUZZ_TARGET}\$" -fuzz="^${FUZZ_TARGET}\$" \
            -fuzztime=30s "$FUZZ_PACKAGE" 2>&1 | tee fuzz.log
          if grep -q "no fuzz tests to fuzz" fuzz.log; then
            echo "::error::${FUZZ_TARGET} matched no fuzz target"
            exit 1
          fi
      # A failing input is written to the package's testdata/fuzz, where it
      # would die with the runner. It is what reproduces the failure, so it
      # is kept as an artifact to commit as a seed.
      - id: crashers
        if: failure()
        run: |
          set -euo pipefail
          {
            echo 'paths<<EOF'
            git ls-files --others --exclude-standard -- '*/testdata/fuzz/*'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - if: failure() && steps.crashers.outputs.paths != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ matrix.fuzz.name }}
          path: ${{ steps.crashers.outputs.paths }}
      # Only main saves: a cache saved on a tag, which release.yml runs
      # this workflow for, is one nothing restores.
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOFUZZCACHE }}
          key: fuzz-${{ matrix.fuzz.name }}-${{ github.sha }}

  # The checks that need a checkout and one step each: typos, and a make
  # target on the Go set up here. They run as steps of one job rather than
  # as jobs of their own, each step whatever the steps before it found, so
  # that one run reports them all, but none on a Go setup-go failed to set
  # up, which would be the runner's.
  # They use the Go the release is built with: govulncheck reports standard
  # library vulnerabilities for the Go it runs under, and the Makefile runs
  # the tools of hack/tools/go.mod with GOTOOLCHAIN set to that Go, which
  # setup-go installs here, so nothing is downloaded. The cache is keyed on
  # both go.sum files: hack/tools/go.sum holds the modules the tools build.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
      - id: go
        if: success() || failure()
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - if: (success() || failure()) && steps.go.outcome == 'success'
        run: make verify-go-floor
      - if: (success() || failure()) && steps.go.outcome == 'success'
        run: make verify-tidy
      - if: (success() || failure()) && steps.go.outcome == 'success'
        run: make verify-mdtoc
      # actionlint runs shellcheck on every run step, and lint-shell on the
      # scripts in hack/, with the shellcheck the runner image provides.
      - if: (success() || failure()) && steps.go.outcome == 'success'
        run: make lint-actions
      - if: (success() || failure()) && steps.go.outcome == 'success'
        run: make lint-shell
      - if: (success() || failure()) && steps.go.outcome == 'success'
        run: make verify-dependencies
      - if: (success() || failure()) && steps.go.outcome == 'success'
        run: make govulncheck
      # Nothing else runs make build, which goreleaser does not use, so a
      # broken version stamp or a binary that links cgo would go unnoticed.
      # The stamp is git describe, which the Makefile reads too.
      - if: (success() || failure()) && steps.go.outcome == 'success'
        run: |
          set -euo pipefail
          make build
          got=$(build/spm --version)
          want="spm $(git describe --tags --always --dirty)"
          if [ "$got" != "$want" ]; then
            echo "::error::build/spm --version printed \"$got\", want \"$want\""
            exit 1
          fi
          if ! grep -q 'CGO_ENABLED=0' <<<"$(go version -m build/spm)"; then
            echo "::error::build/spm was not built with CGO_ENABLED=0"
            exit 1
          fi

  # The checks on the floor Go that regenerate a tracked file and ask git
  # whether it moved: the CLI golden files, and seccomp/syscalls.go from the
  # syscalls.csv of every libseccomp release the guard covers. It also runs
  # the whole of go vet for the Linux architectures the tests run on besides
  # amd64, where go test runs only a few of its checks, and for the BSDs the
  # build tags of cmd/spm name, which nothing else builds (see vet-arch in
  # the Makefile).
  verify-floor:
    name: verify / floor go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make verify-golden
      - if: (success() || failure()) && steps.go.outcome == 'success'
        run: make verify-syscalls
      - if: (success() || failure()) && steps.go.outcome == 'success'
        run: make vet-arch

  # The module's API against the latest release, as gorelease reports it,
  # with the version it suggests for the next one. Below v1 it is a report:
  # hack/api-check.sh exits 0 whatever gorelease says. From v1.0.0 on it is
  # a gate: an incompatible change against a release of the major version
  # go.mod's module path names fails, except the constant values RELEASE.md
  # lets a minor release change. The base is the newest tag before HEAD, so
  # that a tag run compares against the release before it rather than
  # against itself.
  api:
    name: api / gorelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache-dependency-path: hack/tools/go.sum
      - run: make test-api-check
      # The report is captured before it goes to the summary, so that the
      # code fence around it closes even when gorelease fails. It is kept
      # outside the checkout, which gorelease refuses to read with an
      # untracked file in it.
      - run: |
          status=0
          report="${RUNNER_TEMP}/api-report.txt"
          make -s api-report > "${report}" 2>&1 || status=$?
          cat "${report}"
          {
            echo '```'
            cat "${report}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GORELEASER_VERSION: v2.20.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --skip=sign --clean
      # release.yml attests over these paths. goreleaser decides them, so a
      # version bump that moves a binary or an SBOM has to break here rather
      # than ship a release with nothing attested: attest-build-provenance
      # only errors when no subject at all matches.
      # .goreleaser.yml builds 8 binaries: linux on amd64, arm64, ppc64le
      # and s390x, darwin and windows on amd64 and arm64, each with an SBOM.
      # A count that changes means the platforms did, and RELEASE.md, which
      # lists them, has to change with it.
      - name: Check the paths the release attests over
        run: |
          set -euo pipefail
          ls -1 dist/spm_*/spm dist/spm_*/spm.exe \
            dist/spm_*.sbom.json dist/checksums.txt
          binaries=$(find dist -path 'dist/spm_*/spm' -o -path 'dist/spm_*/spm.exe' | wc -l)
          sboms=$(find dist -maxdepth 1 -name 'spm_*.sbom.json' | wc -l)
          if [ "$binaries" -ne 8 ] || [ "$sboms" -ne 8 ]; then
            echo "::error::$binaries binaries and $sboms SBOMs, want 8 of each"
            exit 1
          fi
