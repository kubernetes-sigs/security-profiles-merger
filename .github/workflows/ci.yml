name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this workflow as its gate, so that a tag passes
  # exactly the checks a pull request does.
  workflow_call:

# A newer push to a pull request makes the run before it pointless. A run on
# main is not: it uploads the coverage and saves the benchmark baseline and
# the fuzz corpus of its commit, so every merge must finish its own. A group
# holds one running and one pending run and drops the pending one for a
# newer, whether or not it cancels the running one, so the runs outside pull
# requests are grouped by commit and never share one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# go.mod's go line is the oldest Go the library supports, and the jobs that
# use go-version-file test that floor. The release binaries are built with
# this one instead, a current stable release, so that they do not ship a
# standard library with known vulnerabilities; the jobs that build, test or
# scan what ships use it. release.yml carries the same pin and
# dependencies.yaml tracks both.
env:
  GO_VERSION: "1.27.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build

  # .golangci.yml enables the libseccomp build tag, so this job also
  # analyzes the cgo bridge and the tests that check the model against
  # libseccomp. Loading those packages needs the headers, and the
  # distribution's are enough: nothing here is executed, so which
  # libseccomp answers is test-libseccomp's question, not this job's.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      # cmd/spm has files for hosts that are not Unix, which the run above
      # never loads: a constant only the Unix file used went unnoticed there.
      # Only the command is linted this way, since the libseccomp bridge the
      # config pulls in does not build for Windows.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version: v2.14.0
          args: ./cmd/...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify-coverage
      # A pull request from a fork gets no secrets, so the upload has
      # nothing to authenticate with. Coverage is a report, not a gate:
      # the threshold in verify-coverage above is the gate.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          files: build/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The algorithmic bounds in the suite only assert wall-clock limits when
  # neither coverage nor the race detector is instrumenting the code, so the
  # job above measures nothing. This one runs the same tests plain, which is
  # the only place those bounds are a real assertion.
  test-bounds:
    name: test / bounds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...

  # The same plain run on the Go the release binaries are built with, which
  # is not the floor the jobs above test.
  test-release-go:
    name: test / release go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -count=1 ./...

  # The seccomp merges settle rules by the native architecture: a 32-bit one
  # compares half of each value, and one that multiplexes socket and IPC
  # calls reads those rules a second way. The jobs above only ever run as
  # amd64, so the suite also runs where that needs no emulation: as 386 on
  # the same runners, which is both 32-bit and multiplexing, and on an arm64
  # runner. s390x and ppc64le would need qemu, under which the wall-clock
  # bounds of the suite do not hold, so those are only vetted below.
  test-arch:
    name: test / linux-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: "386"
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

  # The runners are all 64-bit, so a word-size mistake compiles here and
  # breaks for whoever vendors the library into a 32-bit build. Nothing is
  # executed, so no emulation is needed; these are the architectures
  # Kubernetes ships and seccomp/arch.go maps.
  vet-arch:
    name: vet / linux-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goarch: ["386", "arm", "arm64", "s390x", "ppc64le"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...

  # The seccomp merge semantics are a claim about how runc and libseccomp load
  # a profile. This job checks that claim against libseccomp itself, which
  # needs cgo and the headers, so it is separate from the main test job.
  #
  # The versions are built from their release tarballs rather than taken from
  # the runner image: the whole safe-shape model rests on what libseccomp
  # compiles, so which version answered has to be recorded, not inherited.
  # Add a version here when libseccomp releases one.
  test-libseccomp:
    name: test-libseccomp / ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "2.5.5"
            sha256: 248a2c8a4d9b9858aa6baf52712c34afefcf9c9e94b76dce02c1c9aa25fb3375
          - version: "2.6.1"
            sha256: 501f66c667225d53791b97e1d7cf85ab764c297d04881f60f38f451c4b0ee1be
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build libseccomp ${{ matrix.version }}
        env:
          LIBSECCOMP_VERSION: ${{ matrix.version }}
          LIBSECCOMP_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gperf
          curl -sSfL -o libseccomp.tar.gz \
            "https://github.com/seccomp/libseccomp/releases/download/v$LIBSECCOMP_VERSION/libseccomp-$LIBSECCOMP_VERSION.tar.gz"
          # The model is only worth as much as the library it is checked
          # against, so the tarball is pinned rather than merely fetched.
          echo "$LIBSECCOMP_SHA256  libseccomp.tar.gz" | sha256sum --check --strict
          tar xf libseccomp.tar.gz
          cd "libseccomp-$LIBSECCOMP_VERSION"
          # Install over the distribution's own copy rather than into
          # /usr/lib, which the loader searches after the multiarch
          # directory, so that the build and the run agree.
          ./configure --prefix=/usr --libdir=/usr/lib/$(gcc -print-multiarch)
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
      # pkg-config only describes the build. TestLibseccompVersion reads the
      # library the process loaded and fails when it is not this one, so a
      # model checked here is checked against the version named here.
      - name: Run the model against libseccomp ${{ matrix.version }}
        env:
          LIBSECCOMP_VERSION: ${{ matrix.version }}
        run: make test-libseccomp
      # libseccomp sorts the syscalls of a filter by priority unless asked
      # for a binary tree, which is what runc asks for above 32 syscall
      # names, and so for every profile of a realistic size. The model has
      # to hold for the programs of both. Only the tests that compile with
      # the library depend on the level, so only they run again.
      - name: Run the model against libseccomp ${{ matrix.version }}, binary tree
        env:
          LIBSECCOMP_VERSION: ${{ matrix.version }}
          SPM_LIBSECCOMP_OPTIMIZE: "2"
        run: make test-libseccomp TESTFLAGS='-run Libseccomp'

  # The library handles Linux profile paths on every host and binaries are
  # released for these platforms, so the packages are tested there too, on
  # the floor and on the Go the binaries are built with.
  test-cross:
    name: test / ${{ matrix.os }} / ${{ matrix.go }} go
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        go: [floor, release]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go == 'release' && env.GO_VERSION || '' }}
          go-version-file: ${{ matrix.go == 'floor' && 'go.mod' || '' }}
      - run: go test -count=1 ./...

  fuzz-prepare:
    name: fuzz / prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          grep -rn '^func Fuzz' --include='*_test.go' . \
            | sed 's|^\./||' \
            | while IFS=: read -r file _ line; do
                fn=${line#func }
                fn=${fn%%(*}
                dir=$(dirname "$file")
                # The package path and the function name both go into the
                # name, so a new target cannot quietly take the job, and the
                # cache key, of an existing one.
                name="${dir//\//-}-$(tr '[:upper:]' '[:lower:]' <<<"${fn#Fuzz}")"
                echo "{\"name\":\"$name\",\"package\":\"./$dir/\",\"target\":\"$fn\"}"
              done > "$tmp"
          matrix=$(jq -s -c '.' < "$tmp")
          rm -f "$tmp"
          # A target dropped anywhere above would only shrink the matrix,
          # and a shorter matrix still runs green. So the matrix is counted
          # back against the declarations it was derived from.
          want=$(grep -rc '^func Fuzz' --include='*_test.go' . \
            | awk -F: '{ sum += $2 } END { print sum + 0 }')
          got=$(jq -r 'length' <<<"$matrix")
          names=$(jq -r '[.[].name] | unique | length' <<<"$matrix")
          if [ "$want" -eq 0 ] || [ "$got" -ne "$want" ] || [ "$names" -ne "$want" ]; then
            echo "::error::fuzz matrix has $got entries under $names names for $want targets"
            jq -r '.[].name' <<<"$matrix" | sort | uniq -d
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz / ${{ matrix.fuzz.name }}
    needs: [fuzz-prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        fuzz: ${{ fromJSON(needs.fuzz-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The corpus below lives inside the build cache, so leaving this
          # on would store it twice and grow the setup-go entry without
          # bound, once per target per commit.
          cache: false
      # The corpus the fuzzing engine grows lives in the Go build cache, not
      # in testdata/fuzz, which only holds committed regression inputs.
      - run: echo "GOFUZZCACHE=$(go env GOCACHE)/fuzz" >> "$GITHUB_ENV"
      # A pull request starts from the corpus main grew and saves none of
      # its own: a cache saved from a pull request can only be restored by
      # that pull request, so saving one per target and commit there fills
      # the cache quota with entries nothing reads.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOFUZZCACHE }}
          key: fuzz-${{ matrix.fuzz.name }}-${{ github.sha }}
          restore-keys: fuzz-${{ matrix.fuzz.name }}-
      # go test exits 0 when the pattern matches no target, so a target
      # renamed, deleted or hidden behind a build tag would fuzz nothing for
      # thirty seconds and pass. The matrix completeness check counts the
      # declarations; this checks that the run did something. The matrix
      # values reach the script through the environment rather than being
      # written into it.
      - shell: bash
        env:
          FUZZ_TARGET: ${{ matrix.fuzz.target }}
          FUZZ_PACKAGE: ${{ matrix.fuzz.package }}
        run: |
          set -o pipefail
          go test -fuzz="^${FUZZ_TARGET}\$" -fuzztime=30s \
            "$FUZZ_PACKAGE" 2>&1 | tee fuzz.log
          if grep -q "no fuzz tests to fuzz" fuzz.log; then
            echo "::error::${FUZZ_TARGET} matched no fuzz target"
            exit 1
          fi
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOFUZZCACHE }}
          key: fuzz-${{ matrix.fuzz.name }}-${{ github.sha }}

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: benchmark / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: seccomp
            package: ./seccomp/
          - name: apparmor
            package: ./apparmor/
          - name: landlock
            package: ./landlock/
          - name: internal-merge
            package: ./internal/merge/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The default shell does not set pipefail, so without it the pipe
      # into tee hides a failing or panicking benchmark behind tee's own
      # exit code, and the job stays green on partial output.
      - shell: bash
        env:
          BENCH_PACKAGE: ${{ matrix.package }}
        run: |
          set -o pipefail
          go test -bench=. -benchmem -count=5 -run=^$ "$BENCH_PACKAGE" | tee benchmark.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ matrix.name }}
          path: benchmark.txt
      # As for the fuzz corpus, a pull request reads the baseline main saved
      # and saves none of its own, which nothing else could restore.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./cache
          key: benchmark-${{ matrix.name }}-${{ github.sha }}
          restore-keys: benchmark-${{ matrix.name }}-
      # Recorded, not enforced. A doubling looked like a safe threshold
      # until it was tried: the baseline is a cached measurement from
      # another run on another shared runner, so the comparison carries
      # that machine's contention as well as this one's. A run that
      # changed no benchmark measurably against main still alerted on
      # every landlock benchmark at 2.06x and on 60 seccomp benchmarks at
      # 3.4x to 5.8x, including one that takes 45ns. Gating on that trains
      # people to ignore a red run.
      #
      # What actually guards the cost is deterministic and lives
      # elsewhere: the bound assertions the test / bounds job runs
      # uninstrumented, and the budgets the merge enforces. This job
      # tracks the trend and puts it in the job summary.
      #
      # comment-on-alert is left off on purpose: it writes to the pull
      # request, which needs a token a fork does not get.
      - uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: go
          output-file-path: benchmark.txt
          external-data-json-path: ./cache/benchmark-data.json
          alert-threshold: "200%"
          summary-always: true
          fail-on-alert: false
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./cache
          key: benchmark-${{ matrix.name }}-${{ github.sha }}

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # govulncheck reports standard library vulnerabilities for the Go it
      # runs under, so it runs under the Go the release is built with. local
      # keeps go run from switching to another toolchain, and so to another
      # standard library, should govulncheck ever require a newer one.
      - run: make govulncheck
        env:
          GOTOOLCHAIN: local

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify-tidy

  mdtoc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify-mdtoc

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify-golden

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # zeitgeist needs a newer Go than the module's floor; let go run
      # fetch the toolchain its module requires.
      - run: make verify-dependencies
        env:
          GOTOOLCHAIN: auto

  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GORELEASER_VERSION: v2.18.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.52.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --skip=sign --clean
      # release.yml attests over these paths. goreleaser decides them, so a
      # version bump that moves a binary or an SBOM has to break here rather
      # than ship a release with nothing attested: attest-build-provenance
      # only errors when no subject at all matches.
      - name: Check the paths the release attests over
        run: |
          set -euo pipefail
          ls -1 dist/spm_*/spm dist/spm_*/spm.exe \
            dist/spm_*.sbom.json dist/checksums.txt
