# Dependabot updates go.mod, hack/tools/go.mod and the pinned action SHAs.
# The tool versions in dependencies.yaml live in a Makefile variable or a
# workflow env, where it cannot see them, so this workflow asks each upstream
# once a week whether the pin is still the current release. An outdated pin
# is news rather than an error of this repository: the report goes to one
# tracking issue, with a comment whenever it changes, the issue is closed
# once the pins are current, and only a check that cannot run fails. The
# same schedule runs govulncheck, which fails on a finding.
name: dependency-updates

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# bash with -eo pipefail for every run step, as in ci.yml.
defaults:
  run:
    shell: bash

# Runs take turns, so that a manual run does not race the scheduled one.
concurrency:
  group: dependency-updates
  cancel-in-progress: false

# The tools in hack/tools/go.mod run with the Go in .go-version, as in
# ci.yml.
env:
  ISSUE_TITLE: "Tool pins behind their upstream releases"
  ISSUE_LABEL: dependency-updates

jobs:
  # ci.yml runs govulncheck on every push and pull request, but a
  # vulnerability published while nothing is merged would otherwise go
  # unreported until the next one. It runs under the Go the release is built
  # with, as in ci.yml, and a finding fails the run.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache-dependency-path: hack/tools/go.sum
      - run: make govulncheck

  # The check runs code it downloads (zeitgeist), so it gets a token that
  # can only read; the issue is handled by a job of its own.
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      report: ${{ steps.check.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not go.mod: the Makefile runs the tools with the Go in .go-version,
      # which the go command would otherwise download on top of the floor.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Check the pinned versions against their upstreams
        id: check
        env:
          # zeitgeist reads GITHUB_TOKEN, and the unauthenticated API budget
          # does not stretch to a release listing per dependency.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # report-upstream prints the outdated pins and fails only when the
        # check itself does; tee keeps the output visible while it runs.
        run: |
          set -euo pipefail
          make report-upstream 2>&1 | tee report.txt
          {
            echo 'report<<EOF'
            grep '^Update available' report.txt || true
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

  issue:
    needs: upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      REPORT: ${{ needs.upstream.outputs.report }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The newest issue with the label is the tracking issue, open or
      # closed, found through the issues API rather than the search index,
      # which lags behind right after it was created. A closed one is
      # reopened only for a changed report, so that closing it by hand holds
      # a known report back without hiding a new one.
      - name: Update the tracking issue
        run: |
          # The backticks in single quotes below are Markdown code fences,
          # meant literally, which is all shellcheck's SC2016 objects to.
          set -euo pipefail
          gh label create "${ISSUE_LABEL}" --force --color ededed \
            --description "The weekly check of the pinned tool versions reports here"
          issue=$(gh issue list --state all --label "${ISSUE_LABEL}" --limit 1 --json number,state,body)
          number=$(echo "${issue}" | jq -r '.[0].number // empty')
          state=$(echo "${issue}" | jq -r '.[0].state // empty')
          # shellcheck disable=SC2016
          previous=$(echo "${issue}" | jq -r '.[0].body // empty' | tr -d '\r' | sed -n '/^```$/,/^```$/p' | grep '^Update available' || true)
          if [ -z "${REPORT}" ]; then
            if [ -n "${number}" ] && [ "${state}" = "OPEN" ]; then
              gh issue close "${number}" --comment "The pinned tool versions are current again."
            fi
            exit 0
          fi
          # shellcheck disable=SC2016
          body=$(printf 'The weekly check found newer releases of pinned tools:\n\n```\n%s\n```\n\nUpdate the versions in `dependencies.yaml` and in the files its `refPaths` name (`make verify-dependencies` checks that they agree). libseccomp has no refPaths: add the release and the sha256 of its tarball to the `test-libseccomp` matrix in `ci.yml`, the release and the sha256 of its `src/syscalls.csv` to `SYSCALL_CSVS` in the `Makefile`, and the release to `syscallTableVersions` in `seccomp/syscalls_gen_internal_test.go`. Then commit what `make verify-syscalls` regenerates in `seccomp/syscalls.go`, and raise the supported range the seccomp package documentation and `docs/integration.md` state. runc and crun are pinned by checksum as well: update `RUNC_SHA256` or `CRUN_SHA256` in `ci.yml` from the `runc.sha256sum` or `CHECKSUMS` file of the release. This issue is updated by every run and closed once the pins are current.\n\nLast run: %s\n' "${REPORT}" "${RUN_URL}")
          if [ -z "${number}" ]; then
            gh issue create --title "${ISSUE_TITLE}" --label "${ISSUE_LABEL}" --body "${body}"
            exit 0
          fi
          if [ "${previous}" = "${REPORT}" ]; then
            if [ "${state}" = "OPEN" ]; then
              gh issue edit "${number}" --body "${body}"
            fi
            exit 0
          fi
          if [ "${state}" != "OPEN" ]; then
            gh issue reopen "${number}"
          fi
          gh issue edit "${number}" --body "${body}"
          # shellcheck disable=SC2016
          gh issue comment "${number}" --body "$(printf 'The report changed:\n\n```\n%s\n```\n' "${REPORT}")"
