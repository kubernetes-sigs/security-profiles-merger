dependencies:
  - name: golangci-lint
    version: 2.13.2
    refPaths:
      - path: Makefile
        match: ^GOLANGCI_LINT_VERSION
      - path: .github/workflows/ci.yml
        match: "^\\s+version: v"

  - name: syft
    version: 1.51.1
    refPaths:
      - path: .github/workflows/ci.yml
        match: "syft-version: v"
      - path: .github/workflows/release.yml
        match: "syft-version: v"

  - name: goreleaser
    version: 2.18.1
    refPaths:
      - path: .github/workflows/ci.yml
        match: "GORELEASER_VERSION: v"
      - path: .github/workflows/release.yml
        match: "GORELEASER_VERSION: v"

  - name: cosign
    version: 3.0.6
    refPaths:
      - path: .github/workflows/release.yml
        match: "COSIGN_VERSION: v"

  - name: mdtoc
    version: 1.4.0
    refPaths:
      - path: Makefile
        match: ^MDTOC_VERSION

  - name: govulncheck
    version: 1.7.0
    refPaths:
      - path: Makefile
        match: ^GOVULNCHECK_VERSION

  - name: zeitgeist
    version: 0.8.0
    refPaths:
      - path: Makefile
        match: ^ZEITGEIST_VERSION
