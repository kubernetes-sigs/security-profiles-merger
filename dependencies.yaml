# Dependabot tracks pinned action SHAs, go.mod and hack/tools/go.mod, which
# pins mdtoc, govulncheck, zeitgeist, actionlint and gorelease. The versions
# below live in .go-version, a Makefile variable or a workflow env, where it
# cannot see them: refPaths keep those copies in sync with each other, and
# the upstream stanzas let the scheduled dependencies workflow ask each
# project whether the pin is still the current release.
dependencies:
  # The Go the release binaries are built with, in .go-version, which every
  # workflow reads. CI also tests, scans with govulncheck and runs the tools
  # of hack/tools/go.mod with it, so it must not be older than that module's
  # go line. It is not go.mod's go line: that is the oldest Go the library
  # supports, which raising would raise for every consumer. golang/go
  # publishes tags but no GitHub releases, and its tags are not semver, so
  # the official image's tags are what upstream is read from.
  - name: go
    version: 1.27.4
    upstream:
      flavour: container
      registry: golang
    refPaths:
      - path: .go-version
        match: "^[0-9]"

  # The oldest Go the library supports, go.mod's go line, which the jobs
  # that set go-version-file to go.mod test. make verify-go-floor checks
  # that go.mod holds exactly the Makefile's GO_FLOOR, and this keeps the
  # two in step. Raising it raises it for every consumer, so it has no
  # upstream to follow.
  - name: go-floor
    version: "1.24"
    refPaths:
      - path: go.mod
        match: "^go "
      - path: Makefile
        match: ^GO_FLOOR

  - name: golangci-lint
    version: 2.15.0
    upstream:
      flavour: github
      url: golangci/golangci-lint
    refPaths:
      - path: Makefile
        match: ^GOLANGCI_LINT_VERSION
      - path: .github/workflows/ci.yml
        match: "^\\s+version: v"

  - name: syft
    version: 1.57.2
    upstream:
      flavour: github
      url: anchore/syft
    refPaths:
      - path: .github/workflows/ci.yml
        match: "syft-version: v"
      - path: .github/workflows/release.yml
        match: "syft-version: v"

  - name: goreleaser
    version: 2.20.3
    upstream:
      flavour: github
      url: goreleaser/goreleaser
    refPaths:
      - path: .github/workflows/ci.yml
        match: "GORELEASER_VERSION: v"
      - path: .github/workflows/release.yml
        match: "GORELEASER_VERSION: v"

  - name: cosign
    version: 3.1.4
    upstream:
      flavour: github
      url: sigstore/cosign
    refPaths:
      - path: .github/workflows/release.yml
        match: "COSIGN_VERSION: v"

  # The libseccomp versions the seccomp model is checked against, 2.5.4,
  # 2.5.5, 2.6.0, 2.6.1 and 2.6.2, are a matrix in ci.yml, and SYSCALL_CSVS
  # in the Makefile also lists 2.5.2 for the syscall placement table, not
  # one pin, so there is no single line for a refPath to match. Carrying the
  # newest one here is what turns "add a version here when libseccomp
  # releases one" into something a job can notice.
  - name: libseccomp
    version: 2.6.2
    upstream:
      flavour: github
      url: seccomp/libseccomp

  # The runtimes test / runtime runs seccomp results through, as static
  # release binaries. The job pins each by version and checksum in its env,
  # so a bump updates the checksum there too, from the release's
  # runc.sha256sum or CHECKSUMS file.
  - name: runc
    version: 1.5.3
    upstream:
      flavour: github
      url: opencontainers/runc
    refPaths:
      - path: .github/workflows/ci.yml
        match: "RUNC_VERSION: "

  - name: crun
    version: "1.31"
    upstream:
      flavour: github
      url: containers/crun
    refPaths:
      - path: .github/workflows/ci.yml
        match: "CRUN_VERSION: "
