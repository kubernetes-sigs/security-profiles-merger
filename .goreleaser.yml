version: 2

project_name: spm

builds:
  - main: ./cmd/spm/
    binary: spm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - ppc64le
      - s390x
    # Kubernetes ships ppc64le and s390x and seccomp/arch.go maps both, so
    # the CLI is built for them too. Neither exists on darwin or windows.
    ignore:
      - goos: darwin
        goarch: ppc64le
      - goos: darwin
        goarch: s390x
      - goos: windows
        goarch: ppc64le
      - goos: windows
        goarch: s390x
    # The tag keeps its "v" prefix, as git describe (make build) and the
    # module version of go install report it. Snapshots are not the tagged
    # release, so they report their own version.
    ldflags:
      - -s -w -X main.version={{ if .IsSnapshot }}v{{ .Version }}{{ else }}{{ .Tag }}{{ end }}

archives:
  - formats:
      - binary

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    artifacts: checksum

sboms:
  - artifacts: binary
    # The default name starts with the binary name, which is spm.exe on
    # Windows; the project name keeps every SBOM under dist/spm_*.
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.json"

changelog:
  use: github-native

# A tag with a prerelease suffix, such as v0.6.0-rc.1, is published as a
# prerelease rather than as the latest release. The release is created as a
# draft: release.yml publishes it after attesting the provenance of what it
# holds and verifying its signature, so that nothing is public before both.
release:
  prerelease: auto
  draft: true
  # A run that failed after creating the draft leaves it behind, and the
  # next run must not add a second draft for the same tag that the publish
  # step might pick instead.
  replace_existing_draft: true
  # release.yml publishes the release without anyone editing its notes, so
  # the header is what tells a consumer what to change. It links the guide
  # of the release's minor version, which every minor release and its
  # prereleases add before they are tagged and every patch release shares
  # (see RELEASE.md), so a missing guide shows as a broken link rather than
  # as the previous one. Each guide covers one step, so the header points
  # at the others for a longer one.
  header: |
    Callers upgrading from the previous minor release: the
    [v{{ .Major }}.{{ .Minor }} migration guide](https://github.com/kubernetes-sigs/security-profiles-merger/blob/{{ .Tag }}/docs/migration/v{{ .Major }}.{{ .Minor }}.md)
    lists what to change. Coming from an older release, follow each guide
    in [docs/migration](https://github.com/kubernetes-sigs/security-profiles-merger/tree/{{ .Tag }}/docs/migration)
    in turn.
