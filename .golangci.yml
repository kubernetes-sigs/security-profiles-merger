---
version: "2"
run:
  # The cgo bridge and the tests that check the model against libseccomp
  # itself sit behind the libseccomp tag, so without it roughly a fifth of
  # the tree is never analyzed, the check of the apparmor port against
  # apparmor_parser behind its own, and internal/runtimetest, which runs
  # merge results through Landlock, runc and crun, behind the runtime tag.
  # The exclusions below only apply under them too.
  build-tags:
    - apparmor_parser
    - libseccomp
    - runtime
linters:
  # Every linter, so that one a new release adds is enabled by the bump
  # rather than by someone remembering to list it. gomodguard and wsl are
  # deprecated; gomodguard_v2 and wsl_v5 replace them. gochecknoglobals is
  # off: the module's globals are lookup tables and caches, which a nolint
  # on each only restated. exhaustruct and exhaustruct_v5 are off: they made
  # every literal spell out its zero values, which hid the fields a literal
  # actually sets.
  default: all
  disable:
    - exhaustruct
    - exhaustruct_v5
    - gochecknoglobals
    - gomodguard
    - wsl
  settings:
    wrapcheck:
      # The failures internal/merge joins are this module's own.
      ignore-package-globs:
        - sigs.k8s.io/security-profiles-merger/internal/*
      # The defaults, and the errors of a json.Decoder reading a document
      # token by token, which a caller reports as the decoder's.
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - (*encoding/json.Decoder).Token(
        - (*encoding/json.Decoder).Decode(
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/opencontainers/runtime-spec
            - sigs.k8s.io/security-profiles-merger
    # The module level of the depguard rule above: the one module a
    # dependency may come from, and no replace pointing at a local path.
    gomodguard_v2:
      local-replace-directives: true
      allowed:
        - module: github.com/opencontainers/runtime-spec
    gocritic:
      enable-all: true
      disabled-checks:
        - unnamedResult
    goheader:
      template: |-
        Copyright The Kubernetes Authors.

        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

            http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.
    tagliatelle:
      case:
        rules:
          json: goCamel
  exclusions:
    rules:
      - linters:
          - funlen
          - goconst
          - gosec
        path: _test\.go
      - linters:
          - tagliatelle
        path: apparmor/(types|diff)\.go
      - linters:
          - paralleltest
        path: apparmor/glob_internal_test\.go
      # cgo confuses these: dupImport reads the pseudo-package "C" as a
      # second import of "unsafe", and nlreturn reports positions inside the
      # code cgo generates rather than in the source.
      - linters:
          - gocritic
          - nlreturn
        path: internal/libseccomp/bridge\.go
# gofumpt is a stricter gofmt and gci a stricter goimports, so neither of
# those two runs on its own.
formatters:
  enable:
    - gci
    - gofumpt
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
